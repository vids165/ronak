<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, My Love 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffeef4;--card:#ffffff;--ink:#4a2336;--soft:#8a5a70;--pink:#ff8fb1;--berry:#d6336c;--lav:#e9dcff;--butter:#fff1b8;--shadow:rgba(214,51,108,.2);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241320;--card:#3a2132;--ink:#ffe9f1;--soft:#d9a9bf;--berry:#ff7aa8;--lav:#4a3668;--butter:#5a4a22;--shadow:rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#241320;--card:#3a2132;--ink:#ffe9f1;--soft:#d9a9bf;--berry:#ff7aa8;--lav:#4a3668;--butter:#5a4a22;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 Nunito,system-ui,sans-serif;touch-action:pan-y}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;animation:rise linear infinite;opacity:.5}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg)}}
.app{position:relative;height:100%;max-width:460px;margin:0 auto;padding:14px 16px 18px;display:flex;flex-direction:column}
.dots{display:flex;gap:5px;justify-content:center;padding:6px 0 12px}
.dots i{flex:1;max-width:26px;height:5px;border-radius:9px;background:var(--lav);transition:background .3s}
.dots i.on{background:var(--berry)}
.stage{flex:1;min-height:0;display:flex;align-items:center;padding-top:72px}
.wrap{position:relative;width:100%;min-height:0;max-height:100%;display:flex}
.wrap::before,.wrap::after{position:absolute;bottom:-14px;font-size:32px;z-index:3;pointer-events:none}
.wrap::before{content:'🌸';left:-8px;transform:rotate(-15deg)}
.wrap::after{content:'🌷';right:-8px;transform:rotate(12deg)}
.bunny{position:absolute;top:-70px;left:50%;transform:translateX(-50%);z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bunny.hop{animation:hop .55s ease-out}
@keyframes hop{40%{transform:translateX(-50%) translateY(-24px)}}
.ear{animation:wig 3.2s ease-in-out infinite}
.ear.r{animation-delay:.25s}
@keyframes wig{0%,82%,100%{transform:rotate(0)}88%{transform:rotate(-9deg)}94%{transform:rotate(6deg)}}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.card{width:100%;max-height:100%;overflow-y:auto;background:var(--card);border-radius:30px;padding:28px 24px;text-align:center;box-shadow:0 12px 30px var(--shadow);border-bottom:7px solid var(--pink);animation:swap .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes swap{from{opacity:0;transform:translateX(var(--dir,40px)) scale(.96)}}
.card.big{background:linear-gradient(150deg,var(--pink),#ffc1d6);color:#4a2336}
.card.big h2{color:#4a2336}
.emoji{font-size:48px;line-height:1.1}
h2{font:400 clamp(26px,7.5vw,34px)/1.25 Pacifico,cursive;color:var(--berry);margin:10px 0}
.card p{margin:0 0 8px;font-size:18px}
.chat{display:flex;flex-direction:column;gap:7px;margin:10px 0;text-align:left}
.b{max-width:84%;padding:8px 14px;border-radius:18px;font-weight:600;font-size:16px}
.me{align-self:flex-end;background:var(--pink);color:#4a2336;border-bottom-right-radius:5px}
.him{align-self:flex-start;background:var(--lav);color:var(--ink);border-bottom-left-radius:5px}
.love{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px;text-align:left}
.love li{background:var(--lav);border-radius:16px;padding:9px 14px;font-weight:600;font-size:16px}
.love li:nth-child(odd){background:var(--butter)}
.card.dream{background:linear-gradient(165deg,#5b3fc4,#b247cc 60%,#ff8fb1);color:#fff;border-bottom-color:#ffd45c}
.card.dream h2{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.card.dream p{font-size:19px}
.spark{font-size:26px;letter-spacing:8px;margin-top:6px}
@media (prefers-reduced-motion:no-preference){.spark{animation:twinkle 2.2s ease-in-out infinite}}
@keyframes twinkle{50%{opacity:.35;transform:scale(1.12)}}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:16px}
.note{position:relative;padding:18px 10px 12px;border-radius:6px 6px 16px 6px;font:800 15px/1.35 Nunito,sans-serif;color:#4a2336;box-shadow:0 6px 12px var(--shadow)}
.note b{display:block;font-size:28px;margin-bottom:2px}
.note::before{content:'';position:absolute;top:-8px;left:50%;width:46px;height:15px;margin-left:-23px;background:rgba(255,255,255,.7);border-radius:3px;transform:rotate(-3deg)}
.n1{background:#ffd6e5;transform:rotate(-3deg)}
.n2{background:#e6dcff;transform:rotate(2.5deg)}
.n3{background:#fff1b8;transform:rotate(2deg)}
.n4{background:#d4f5e6;transform:rotate(-2deg)}
.n5{background:#ffd9c7;transform:rotate(-1deg);grid-column:1/-1}
.nav{display:flex;gap:10px;padding-top:14px}
button{font:800 18px Nunito,sans-serif;border:0;border-radius:999px;padding:14px 20px;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.95)}
button:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
#next{flex:1;color:#fff;background:var(--berry);box-shadow:0 8px 18px var(--shadow)}
#back{background:var(--lav);color:var(--ink)}
#back[hidden]{display:none}
.pop{position:fixed;left:50%;top:60%;font-size:26px;pointer-events:none;z-index:5;animation:pop 1.7s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.hearts span{animation:none;display:none}.card,.ear,.eye,.bunny.hop{animation:none}}
@media (max-height:640px){.emoji{font-size:36px}.card{padding:18px}.card p{font-size:16px}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<div class="app">
<div class="dots" id="dots" aria-hidden="true"></div>
<div class="stage"><div class="wrap"><div class="bunny" id="bunny" role="button" aria-label="Tap the bunny"><svg viewBox="0 -6 120 82" width="120" height="82"><g class="ear l" style="transform-origin:42px 40px"><ellipse cx="42" cy="22" rx="11" ry="24" fill="#fff" stroke="#4a2336" stroke-width="2.5"/><ellipse cx="42" cy="24" rx="5.5" ry="16" fill="#ffb3cc"/></g><g class="ear r" style="transform-origin:78px 40px"><ellipse cx="78" cy="22" rx="11" ry="24" fill="#fff" stroke="#4a2336" stroke-width="2.5"/><ellipse cx="78" cy="24" rx="5.5" ry="16" fill="#ffb3cc"/></g><ellipse cx="60" cy="52" rx="31" ry="22" fill="#fff" stroke="#4a2336" stroke-width="2.5"/><circle class="eye" cx="49" cy="50" r="3.3" fill="#4a2336"/><circle class="eye" cx="71" cy="50" r="3.3" fill="#4a2336"/><ellipse cx="41" cy="58" rx="5.5" ry="3.5" fill="#ffb3cc" opacity=".85"/><ellipse cx="79" cy="58" rx="5.5" ry="3.5" fill="#ffb3cc" opacity=".85"/><ellipse cx="60" cy="56" rx="3" ry="2.2" fill="#ff6f9f"/><path d="M55.5 61 Q60 66 64.5 61" fill="none" stroke="#4a2336" stroke-width="2" stroke-linecap="round"/><g transform="translate(88,30)"><circle cx="0" cy="-4" r="3.2" fill="#ff8fb1"/><circle cx="4" cy="-1" r="3.2" fill="#ff8fb1"/><circle cx="2.5" cy="3.5" r="3.2" fill="#ff8fb1"/><circle cx="-2.5" cy="3.5" r="3.2" fill="#ff8fb1"/><circle cx="-4" cy="-1" r="3.2" fill="#ff8fb1"/><circle r="2.3" fill="#ffd45c"/></g></svg></div><div class="card" id="card" aria-live="polite"></div></div></div>
<div class="nav"><button id="back" type="button" hidden aria-label="Previous">←</button><button id="next" type="button">Tap to begin 💗</button></div>
</div>
<script>
(function(){
var S=[
{e:'🥺',t:'Hii baby',p:'I made something little for you today… tap and see 💗<br>(and tap my bunny 🐰)',n:'Tap to begin 💗'},
{e:'🎂',t:'Happy Birthday, My Love',p:'Today is all about you, my favourite person. 🎉',big:1},
{e:'🥹',t:'Never thought we’d be here',p:'I never imagined we would end up like this, together, as <b>us</b>. Life has the cutest plot twists.'},
{e:'🙈',t:'I was scared of you',p:'At first I was so scared to ask you to be my boyfriend. My heart did loud things every time I thought about it.'},
{e:'💬',t:'Then we started talking',p:'Sometimes we talked, sometimes a little more, and slowly we became close. I didn’t even notice it happening.'},
{e:'🌸',t:'A tiny crush',p:'I had a crush on you at the end of second semester, but back then I didn’t think much about it. Little did I know 🤭'},
{e:'🦋',t:'Moving on, thinking of you',p:'I had a breakup. After some time, when I finally moved on, I started thinking about you. Funny how the heart finds its way.'},
{e:'📚',t:'Viva day',h:'<div class="chat"><div class="b me">where are you? 👀</div><div class="b him">where are you?</div><div class="b me">sitting by the library</div><div class="b him">I’m coming, wait for me 🏃</div></div><p>You came and said “Let’s go.” I was so happy… but I had to say no that day 🥺</p>'},
{e:'🧴',t:'The skincare moment',p:'The very next day we met again and you showed me your skincare. I melted right there 🫠'},
{e:'🏏',t:'The cricket match',p:'We all went to watch a cricket match, and that’s when we held hands for the very first time. <b>My world stopped.</b> 🤍'},
{e:'📱',t:'Miles apart, still together',p:'You had your operation and I went to the USA. We spoke almost every day on video calls, and the distance felt so small.'},
{e:'🏠',t:'Back home, back to you',p:'When I came back, we started meeting every single day. And somewhere in those days, I knew.'},
{e:'💞',t:'28 July',p:'<b>You are mine and I am yours.</b><br>Finally. 🥺❤️',big:1},
{e:'🫶',t:'Things I love about you',h:'<div class="notes"><div class="note n1"><b>😌</b>You handle me and my angry moments</div><div class="note n2"><b>💡</b>You help me understand things, truly a dream</div><div class="note n3"><b>🙊</b>You listen to all my junk talks</div><div class="note n4"><b>😂</b>You make me laugh when I’m sad</div><div class="note n5"><b>🥺</b>The way you look at me</div></div>'},
{e:'🌙',t:'The way you love me is mesmerising',dream:1,h:'<p>I could get lost in it forever. Nothing feels as magical as being loved by you.</p><div class="spark">✨💫✨</div>'},
{e:'🎉',t:'Happiest Birthday, my boyfriend',p:'Thank you for being my safe place, my best friend and my favourite person. I love you, today and every day after.',n:'Tap for a surprise 💖',pop:1},
{e:'🎁',t:'One more thing…',p:'<b>Are you ready for the surprise tomorrow?</b> 🤭<br>Don’t ask me what it is. I’m not telling 🤐💗',big:1,n:'One last thing 💌',pop:1},
{e:'🐰💖',t:'Love you soooo sooooo sooooooooo much baby',p:'bavv jjj badhuuu 🥰<br><b>and always and forever</b> ♾️🌷',big:1,n:'Start again 🔁',last:1}
];
var i=0,card=document.getElementById('card'),nx=document.getElementById('next'),bk=document.getElementById('back'),dots=document.getElementById('dots');
S.forEach(function(){dots.appendChild(document.createElement('i'))});
function burst(){var set=['🎂','💖','🎉','🌷','🌸','🌼','🐰','🎈','✨','🌻'];for(var k=0;k<28;k++){(function(){var p=document.createElement('div');p.className='pop';p.textContent=set[Math.floor(Math.random()*set.length)];p.style.setProperty('--x',(Math.random()*340-170)+'px');p.style.setProperty('--y',(-Math.random()*420-60)+'px');p.style.setProperty('--r',(Math.random()*360-180)+'deg');document.body.appendChild(p);setTimeout(function(){p.remove()},1800)})()}}
function show(n,dir){
var s=S[n];i=n;
card.style.setProperty('--dir',(dir<0?-40:40)+'px');
card.className='card'+(s.big?' big':'')+(s.dream?' dream':'');
void card.offsetWidth;
card.innerHTML='<div class="emoji">'+s.e+'</div><h2>'+s.t+'</h2>'+(s.h||'<p>'+s.p+'</p>');
card.scrollTop=0;
nx.textContent=s.n||'Next 💗';
bk.hidden=n===0;
[].forEach.call(dots.children,function(d,k){d.className=k<=n?'on':''});
}
function go(d){
if(d>0&&S[i].pop)burst();
if(d>0&&S[i].last){show(0,1);return}
var n=i+d;if(n<0||n>=S.length)return;show(n,d);
}
nx.addEventListener('click',function(){go(1)});
document.getElementById('bunny').addEventListener('click',function(){var b=this;b.classList.remove('hop');void b.offsetWidth;b.classList.add('hop');burst()});
bk.addEventListener('click',function(){go(-1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
var x0=null;
document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(dx<-60)go(1);else if(dx>60)go(-1)},{passive:true});
var h=document.getElementById('hearts'),em=['💗','🌸','🌷','✨','🌼','💕','🐰'];
for(var k=0;k<12;k++){var s=document.createElement('span');s.textContent=em[k%em.length];s.style.left=(Math.random()*100)+'%';s.style.fontSize=(14+Math.random()*16)+'px';s.style.animationDuration=(9+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*14)+'s';h.appendChild(s)}
show(0,1);
})();
</script>
</body>
</html>
